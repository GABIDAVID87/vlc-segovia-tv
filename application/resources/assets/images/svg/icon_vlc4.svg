<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Fondo negro -->
  <rect width="800" height="800" fill="#000000"/>
  
  <!-- Círculo amarillo principal -->
  <circle cx="400" cy="320" r="220" fill="#FFEB00"/>
  
  <!-- Icono de TV -->
  <rect x="260" y="240" width="280" height="200" rx="25" ry="25" fill="none" stroke="#000000" stroke-width="18"/>
  <rect x="285" y="265" width="230" height="150" rx="12" ry="12" fill="#FFEB00"/>
  <polygon points="360,300 360,380 450,340" fill="#000000"/>
  <rect x="340" y="440" width="120" height="12" rx="6" ry="6" fill="#000000"/>
  <rect x="380" y="440" width="40" height="25" fill="#000000"/>
  
  <!-- Antenas -->
  <line x1="400" y1="240" x2="330" y2="170" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <circle cx="330" cy="170" r="14" fill="#000000"/>
  <line x1="400" y1="240" x2="470" y2="170" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <circle cx="470" cy="170" r="14" fill="#000000"/>
  
  <!-- Texto SEGOVIA -->
  <text x="120" y="650" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="#FFFFFF" letter-spacing="2">SEGOVIA</text>
  
  <!-- Fondo y texto TV -->
  <rect x="585" y="555" width="170" height="115" rx="18" ry="18" fill="#FFEB00"/>
  <text x="605" y="650" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="#000000" letter-spacing="2">TV</text>
</svg>
